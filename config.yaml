# Freeze damage assessment - Lake County (Clermont), Florida, Jan-Feb 2026.
# Every setting lives here; the code has no hard-coded values.

run:
  resolution_m: 10            # full run
  test_resolution_m: 60       # python run.py --test
  crs: "EPSG:32617"           # UTM 17N (native CRS of tile 17RMM)
  cache_dir: "data/cache"     # downloaded bands, one GeoTIFF per band and date
  output_dir: "outputs"       # rasters, vectors, tables
  figures_dir: "figures"      # PNGs of the full run (test-run figures go to outputs/60m/figures)

aoi:
  bbox: [-81.95, 28.40, -81.60, 28.85]   # lon/lat: west, south, east, north

sentinel2:
  stac_url: "https://earth-search.aws.element84.com/v1"
  collection: "sentinel-2-l2a"
  mgrs_tile: "MGRS-17RMM"
  start_date: "2026-01-04"
  end_date: "2026-02-23"
  # Band names used by Earth Search: blue=B02, green=B03, red=B04, rededge1=B05,
  # nir=B08, nir08=B8A, swir16=B11, scl=scene classification
  base_bands: ["red", "nir", "scl"]      # needed on every date (cloud mask + NDVI)
  scale: 10000                # reflectance = (DN + offset) / scale
  boa_offset: -1000           # applied only where the data contain the offset (see data.py)
  offset_check_max_below: 0.01
  clear_scl_classes: [4, 5]   # 4 = vegetation, 5 = bare soil; everything else is masked
  resampling: "average"       # reflectance bands ("nearest" is always used for scl)
  chunk_size: 2048
  retries: 5                  # download tries per date (unstable connections)
  retry_wait_s: 30            # doubles after each failed try
  gdal_http_retries: 5
  gdal_http_retry_delay_s: 10

dates:
  baseline: ["2026-01-04", "2026-01-07", "2026-01-17", "2026-01-22", "2026-01-27"]
  damage_early: "2026-02-06"
  damage_late: "2026-02-21"
  noise_pair: ["2026-01-17", "2026-01-27"]   # two pre-freeze dates: normal date-to-date change
  freeze_period: ["2026-01-26", "2026-02-02"] # shaded in the time-series figure

timeseries:
  min_clear_pct: 20           # dates with less clear land are skipped (unless baseline/damage dates)
  # The time series uses only pixels that are clear on ALL plotted dates, and plots each
  # pixel's change vs its own baseline. While less citrus than min_common_ha is clear on
  # all dates, the cloudiest date is left out (damage dates are always kept).
  min_common_ha: 20
  date_notes:                 # marked on the plot if the date is kept
    "2026-02-01": "1 Feb: during freeze - ice/irrigation water on canopy"

indices: ["NDVI", "EVI", "NDRE", "NDWI", "MCARI"]   # NDVI drives the damage classes

thresholds:
  vegetation_ndvi: 0.3        # baseline NDVI >= this = vegetated
  mild: -0.10                 # NDVI change classes: none >= mild > mild >= moderate ...
  moderate: -0.20
  severe: -0.30
  recovery_tolerance: 0.05    # 21 Feb vs 6 Feb: NDVI rises smaller than this count as "same"

prior_year:                   # "Is it seasonal?": the same NDVI change one year earlier
  label: "2025"
  start_date: "2025-01-01"
  end_date: "2025-02-28"
  baseline: ["2025-01-02", "2025-01-12", "2025-01-17", "2025-01-27"]   # 22 Jan 2025 was fully cloudy
  damage_early: "2025-02-06"
  damage_late: "2025-02-21"

terrain:                      # frost-prone (low-lying) areas
  dem_collection: "cop-dem-glo-30"   # Copernicus DEM 30 m, from the same STAC catalogue
  lowlying_radius_m: 300      # low-lying index = elevation - mean elevation within this distance
  hollow_m: 0.0               # hollow:      deep_hollow_m <= index < hollow_m
  deep_hollow_m: -4.0         # deep hollow: index < deep_hollow_m
  lowlying_bins: [-4, -2, 0, 2]
  damage_date: "2026-02-06"   # date whose citrus damage is related to terrain (closest to the freeze)
  water_date: "2026-02-06"    # lakes (SCL class 6 on this date) are left out of the map
  water_scl_class: 6

kill_zones:
  late_min_class: 2           # moderate or worse on 21 Feb ...
  early_min_class: 1          # ... and already mild or worse on 6 Feb
  min_area_ha: 0.1
  connectivity: 8

citrus:
  cdl_year: 2025
  cdl_class: 72               # USDA Cropland Data Layer class "Citrus"
  cdl_crs: "EPSG:5070"
  api_url: "https://nassgeodata.gmu.edu/axis2/services/CDLService/GetCDLFile"
  timeout_s: 120
  retries: 5
  retry_wait_s: 10

plots:
  max_pixels: 1200            # maps are downsampled so the longer side is at most this
  dpi: 130
  map_percentiles: [2, 98]    # colour range of index maps (from baseline, vegetated pixels)
  change_percentile: 98       # symmetric colour range of change maps
  zoom_km: 3                  # close-up around the largest kill zone
  zoom_citrus_km: 5           # window around the densest citrus (citrus maps)
  rgb_date: "2026-02-06"      # true-colour background (mostly cloud-free)
  rgb_stretch: [2, 98]        # contrast stretch percentiles
  colors:
    surface: "#fcfcfb"
    land: "#e3e2de"           # non-citrus land on damage maps
    text: "#0b0b0b"
    muted: "#52514e"
    citrus: "#eb6834"
    other_veg: "#2a78d6"
    freeze: "#d9d8d3"
    citrus_ok: "#9fbf8f"
    damage: ["#ef8a62", "#cc4c3b", "#8b1a1a"]   # mild, moderate, severe
    kill_zone: "#1c5cab"
    recovery: ["#1c5cab", "#6da7ec", "#e34948", "#eda100"]   # recovered, partly, same or worse, new damage
    frost: ["#86b6ef", "#1c5cab"]                             # hollow, deep hollow
    note: "#8a8984"
    prior_year: "#a3a29d"        # grey bars (2025) in the seasonal chart
    citrus_outline: "#000000"
    zoom_box: "#52514e"          # dashed box marking the main citrus area
  index_cmaps: {NDVI: "YlGn", EVI: "YlGn", NDRE: "YlGn", NDWI: "GnBu", MCARI: "YlGn"}
